name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Python 套件
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pyinstaller

      - name: 安裝 FFmpeg
        shell: powershell
        run: |
          choco install ffmpeg -y

      - name: 建立 EXE
        run: |
          pyinstaller --onefile --windowed --name VideoDownloader video_downloader.py

      - name: 準備 FFmpeg
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist\ffmpeg"
          Copy-Item "C:\ProgramData\chocolatey\bin\ffmpeg.exe" "dist\ffmpeg\ffmpeg.exe"
          Copy-Item "C:\ProgramData\chocolatey\bin\ffprobe.exe" "dist\ffmpeg\ffprobe.exe"

      - name: 打包下載檔
        shell: powershell
        run: |
          Compress-Archive -Path "dist\VideoDownloader.exe", "dist\ffmpeg" -DestinationPath "VideoDownloader-Windows.zip"

      - name: 上傳 EXE
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Windows
          path: VideoDownloader-Windows.zip
