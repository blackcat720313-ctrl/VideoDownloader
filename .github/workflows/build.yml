name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Python 套件
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pyinstaller

      - name: 安裝 FFmpeg
        shell: powershell
        run: |
          choco install ffmpeg -y
          ffmpeg -version
          ffprobe -version

      - name: 建立 EXE
        run: |
          pyinstaller --onefile --windowed --name VideoDownloader video_downloader.py

      - name: 準備 FFmpeg
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist\ffmpeg"

          $ffmpegPath = (Get-Command ffmpeg).Source
          $ffprobePath = (Get-Command ffprobe).Source

          Copy-Item $ffmpegPath "dist\ffmpeg\ffmpeg.exe"
          Copy-Item $ffprobePath "dist\ffmpeg\ffprobe.exe"

      - name: 檢查輸出檔案
        shell: powershell
        run: |
          if (-not (Test-Path "dist\VideoDownloader.exe")) {
            throw "找不到 VideoDownloader.exe"
          }

          if (-not (Test-Path "dist\ffmpeg\ffmpeg.exe")) {
            throw "找不到 ffmpeg.exe"
          }

          if (-not (Test-Path "dist\ffmpeg\ffprobe.exe")) {
            throw "找不到 ffprobe.exe"
          }

          Write-Host "EXE 和 FFmpeg 檔案確認完成！"

      - name: 打包下載檔
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\VideoDownloader.exe", "dist\ffmpeg" `
            -DestinationPath "VideoDownloader-Windows.zip"

      - name: 上傳 EXE
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Windows
          path: VideoDownloader-Windows.zip
