name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Python 套件
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pyinstaller

      - name: 安裝 FFmpeg
        shell: powershell
        run: |
          choco install ffmpeg -y
          ffmpeg -version
          ffprobe -version

      - name: 建立 EXE
        run: |
          pyinstaller --onefile --windowed --name VideoDownloader video_downloader.py

      - name: 準備 FFmpeg
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "release\ffmpeg"

          $ffmpegPath = (Get-Command ffmpeg).Source
          $ffprobePath = (Get-Command ffprobe).Source

          Copy-Item $ffmpegPath "release\ffmpeg\ffmpeg.exe"
          Copy-Item $ffprobePath "release\ffmpeg\ffprobe.exe"

          Copy-Item "dist\VideoDownloader.exe" "release\VideoDownloader.exe"

      - name: 檢查成品
        shell: powershell
        run: |
          Get-ChildItem -Recurse "release"

      - name: 打包成 ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "release\*" `
            -DestinationPath "VideoDownloader-Windows.zip" `
            -Force

      - name: 上傳成品
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Windows
          path: VideoDownloader-Windows.zip
